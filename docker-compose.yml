services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salesmakrs
      POSTGRES_PASSWORD: salesmakrs
      POSTGRES_DB: salesmakrs
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesmakrs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://salesmakrs:salesmakrs@db:5432/salesmakrs
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  db_data:

